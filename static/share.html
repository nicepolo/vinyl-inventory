<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>萬鴻黑膠精選</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}.top{background:#17182d;color:#fff;padding:18px}.brand{max-width:900px;margin:auto;display:flex;align-items:center;gap:13px}.logo{width:68px;height:68px;object-fit:contain;background:#fff;border-radius:10px}h1{font-size:22px;margin:0}.sub{font-size:13px;color:#c7cad8;margin:6px 0 0}.wrap{max-width:900px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(17,24,39,.07)}.cover{width:100%;aspect-ratio:1.3;object-fit:cover;background:#e5e7eb}.body{padding:15px}.artist{font-weight:800;font-size:17px}.album{color:#6b7280;margin-top:4px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{background:#eef2ff;color:#3730a3;border-radius:20px;padding:3px 9px;font-size:12px}.detail{font-size:13px;line-height:1.7;margin-top:10px;color:#4b5563}.note{border-top:1px solid #d1d5db;margin-top:20px;padding-top:12px;color:#6b7280;font-size:12px;line-height:1.6}.err{background:#fee2e2;color:#991b1b;padding:14px;border-radius:10px}@media(max-width:620px){.grid{grid-template-columns:1fr}.wrap{padding:12px}.top{padding:14px}.logo{width:56px;height:56px}h1{font-size:19px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><img class="logo" src="/static/wanhung-logo.jpg" alt="萬鴻 Logo"><div><h1 id="title">萬鴻黑膠精選</h1><p class="sub" id="sub">載入中…</p></div></div></header>
<main class="wrap"><div class="grid" id="grid"></div><p class="note">本頁為萬鴻提供的唯讀展示資料，不代表鑑定證書或價格保證。如需進一步資訊，請聯繫萬鴻承辦人員。</p></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const token=location.pathname.split("/").pop();
fetch("/api/public/share/"+token).then(r=>r.json()).then(d=>{
  if(d.error)throw new Error(d.error);
  document.getElementById("title").textContent=d.meta.title;
  document.title=d.meta.title;
  document.getElementById("sub").textContent=`共 ${d.records.length} 張 · 唯讀分享`;
  document.getElementById("grid").innerHTML=d.records.map(r=>`<article class="card">${r.image_url?`<img class="cover" src="${esc(r.image_url)}" alt="${esc(r.album)}">`:`<div class="cover"></div>`}<div class="body"><div class="artist">${esc(r.artist||"未知藝人")}</div><div class="album">${esc(r.album||"未知專輯")}</div><div class="tags">${[r.grade&&r.grade+"級",r.format,r.year,r.label].filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>${[r.genre,r.condition,r.tracks].filter(Boolean).length?`<div class="detail">${esc([r.genre,r.condition,r.tracks].filter(Boolean).join(" · "))}</div>`:""}</div></article>`).join("");
}).catch(e=>{document.getElementById("sub").textContent="";document.getElementById("grid").innerHTML=`<div class="err">${esc(e.message||"連結無效或已撤銷")}</div>`;});
</script>
</body>
</html>
